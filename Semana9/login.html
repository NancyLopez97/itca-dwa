<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | TechStore</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark-subtle d-flex align-items-center min-vh-100">
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-7 col-lg-5">
        <div class="card shadow">
          <div class="card-body p-4">
            <h1 class="h4 text-center mb-4">TechStore · Acceso</h1>

            <form id="formLogin" class="needs-validation" novalidate>
              <fieldset id="campos">
                <div class="form-floating mb-3">
                  <input type="text" class="form-control" id="usuario" placeholder="usuario"
                         required pattern="[A-Za-z0-9._]{4,20}">
                  <label for="usuario">Usuario</label>
                  <div class="valid-feedback">Correcto</div>
                  <div class="invalid-feedback">Debe completar el campo (4 a 20 caracteres, sin espacios)</div>
                </div>

                <label for="clave" class="form-label">Contraseña</label>
                <div class="input-group has-validation">
                  <input type="password" class="form-control" id="clave" required
                         pattern="(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,20}"
                         aria-describedby="claveAyuda">
                  <button class="btn btn-outline-secondary" type="button" id="btnVer">Ver</button>
                  <div class="valid-feedback">Correcto</div>
                  <div class="invalid-feedback">Debe completar el campo con una contraseña válida</div>
                </div>
                <div id="claveAyuda" class="form-text mb-3">
                  De 8 a 20 caracteres, con letras y números, sin espacios ni símbolos.
                </div>

                <div class="form-check form-switch mb-3">
                  <input class="form-check-input" type="checkbox" role="switch" id="recordar">
                  <label class="form-check-label" for="recordar">Recordarme</label>
                </div>

                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
              </fieldset>
            </form>

            <div id="mensaje" class="mt-3" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
