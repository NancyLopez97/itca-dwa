<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semana 9 | Formularios con Bootstrap 5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <h1 class="h4 mb-3">Ejercicio 3: pedido de artesanías</h1>
    <form class="row g-3">
      <div class="col-md-6">
        <div class="form-floating">
          <input type="text" class="form-control" id="producto" placeholder="Producto">
          <label for="producto">Producto</label>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-floating">
          <select class="form-select" id="categoria">
            <option value="ceramica">Cerámica</option>
            <option value="textiles">Textiles</option>
            <option value="madera">Madera tallada</option>
          </select>
          <label for="categoria">Categoría</label>
        </div>
      </div>
      <div class="col-md-6">
        <label for="precio" class="form-label">Precio unitario</label>
        <div class="input-group">
          <span class="input-group-text">$</span>
          <input type="number" class="form-control" id="precio" min="0" step="0.01">
          <span class="input-group-text">USD</span>
        </div>
      </div>
      <div class="col-md-6">
        <label for="cantidad" class="form-label">Cantidad: <output id="valorCantidad">10</output></label>
        <input type="range" class="form-range" id="cantidad" min="1" max="100" value="10">
      </div>
      <div class="col-md-6">
        <label for="foto" class="form-label">Fotografía del producto</label>
        <input type="file" class="form-control" id="foto" accept="image/*">
      </div>
      <div class="col-md-6 d-flex align-items-end">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="envio">
          <label class="form-check-label" for="envio">Envío a domicilio</label>
        </div>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-success btn-lg w-100">Agregar al pedido</button>
      </div>
    </form>

    <script>
      const rango = document.getElementById('cantidad');
      rango.addEventListener('input', () => {
        document.getElementById('valorCantidad').textContent = rango.value;
      });
    </script>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
