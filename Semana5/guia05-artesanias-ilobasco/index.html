<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Artesanias Ilobasco - Catálogo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <nav class="navbar navbar-dark bg-dark mb-4">
            <div class="container">
                <span class="navbar-brand mb-0 h1">Artesanias Ilobasco</span>
                <span class="navbar-text" id="resumen-carrito">Carrito: <span id="contador-carrito">0</span> artículos - Total: $<span id="total-carrito">0.00</span></span>
            </div>
        </nav>
        <div class="container">
            <p class="text-center">Bienvenido a nuestro catálogo de artesanías</p>
            <p id="aviso" class="aviso text-center"></p>
            <input type="text" id="buscador" class="form-control mb-4" placeholder="Buscar productos...">
            <main id="catalogo" class="row g-3">
                <!-- Aquí se generarán los productos dinámicamente -->
            </main>
            <script src="app.js"></script>
        </div>
    </body>
</html>
