<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Semana 4 - Ejercicio 7: Gestion de Libros</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="estilos.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand mb-0 h1">Gestion de Libros</span>
      </div>
    </nav>

    <div class="container my-4">
      <div class="row g-4">
        <div class="col-12 col-lg-5">
          <div class="card">
            <div class="card-header">Agregar un libro</div>
            <div class="card-body">
              <div id="mensaje" class="d-none"></div>

              <div class="mb-3">
                <label for="titulo" class="form-label">Titulo</label>
                <input
                  type="text"
                  class="form-control"
                  id="titulo"
                />
              </div>

              <div class="mb-3">
                <label for="autor" class="form-label">Autor</label>
                <input
                  type="text"
                  class="form-control"
                  id="autor"
                />
              </div>

              <div class="mb-3">
                <label for="isbn" class="form-label">ISBN</label>
                <input
                  type="text"
                  class="form-control"
                  id="isbn"
                />
                <div class="form-text">Debe tener 10 o 13 digitos numericos.</div>
              </div>

              <div class="mb-3">
                <label for="anio" class="form-label">Anio de publicacion</label>
                <input
                  type="number"
                  class="form-control"
                  id="anio"
                />
              </div>

              <div class="mb-3">
                <label for="genero" class="form-label">Genero</label>
                <select class="form-select" id="genero">
                  <option value="">Seleccione un genero</option>
                  <option>Novela</option>
                  <option>Cuento</option>
                  <option>Poesia</option>
                  <option>Ensayo</option>
                  <option>Ciencia ficcion</option>
                  <option>Tecnico</option>
                </select>
              </div>

              <div class="d-flex gap-2">
                <button class="btn btn-primary" id="btnAgregar">Agregar libro</button>
                <button class="btn btn-outline-secondary" id="btnLimpiar">
                  Limpiar campos
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-7">
          <div class="card">
            <div
              class="card-header d-flex justify-content-between align-items-center"
            >
              <span>Libros agregados</span>
              <span class="badge text-bg-secondary" id="contador">0</span>
            </div>
            <div class="card-body">
              <div id="listaLibros"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="libros.js"></script>
  </body>
</html>
