<body>
    <h1>Ejercicio 3</h1>
    <p>Abre la consola con F12 para ver los datos.</p>

    <script>
        var estudiante = {
            carnet: "169617",

            edad: 20,
            facultad: {
                nombre: "Facultad de Ingenieria",
                escuela: {
