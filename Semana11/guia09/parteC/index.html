<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicio 3 · Primer componente con Alpine.js</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>[x-cloak] { display: none !important; }</style>
  <script src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-light">
  <div class="container py-4" x-data="catalogo()" x-cloak>
    <h1 class="h3 mb-3">Inventario (Alpine.js)</h1>

    <div class="alert alert-danger" x-show="error" x-text="error"></div>
    <p x-show="cargando">Cargando...</p>

    <form class="row g-2 mb-4 align-items-start" @submit.prevent="agregar()" novalidate>
      <div class="col-md-4">
        <input class="form-control" placeholder="Nombre" x-model="nuevo.nombre"
               :class="{ 'is-invalid': intento && errores.nombre }">
        <div class="invalid-feedback" x-text="errores.nombre"></div>
      </div>
      <div class="col-md-3">
        <select class="form-select" x-model="nuevo.categoria"
                :class="{ 'is-invalid': intento && errores.categoria }">
          <option value="">Categoría...</option>
          <template x-for="c in categorias" :key="c">
            <option :value="c" x-text="c"></option>
          </template>
        </select>
        <div class="invalid-feedback" x-text="errores.categoria"></div>
      </div>
      <div class="col-md-2">
        <input type="number" step="0.01" class="form-control" placeholder="Precio" x-model.number="nuevo.precio"
               :class="{ 'is-invalid': intento && errores.precio }">
        <div class="invalid-feedback" x-text="errores.precio"></div>
      </div>
      <div class="col-md-2">
        <input type="number" class="form-control" placeholder="Cantidad" x-model.number="nuevo.cantidad"
               :class="{ 'is-invalid': intento && errores.cantidad }">
        <div class="invalid-feedback" x-text="errores.cantidad"></div>
      </div>
      <div class="col-md-1 d-grid">
        <button class="btn btn-primary">+</button>
      </div>
    </form>

    <input type="search" class="form-control mb-3" placeholder="Buscar por nombre o categoría..."
           x-model="busqueda">
    <p class="text-muted">Mostrando <span x-text="filtrados.length"></span>
       de <span x-text="productos.length"></span> productos</p>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead class="table-dark">
          <tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Cantidad</th><th>Acciones</th></tr>
        </thead>
        <tbody>
          <template x-for="p in filtrados" :key="p.id">
            <tr>
              <td x-text="p.nombre"></td>
              <td x-text="p.categoria"></td>
              <td x-text="'$' + p.precio.toFixed(2)"></td>
              <td><span class="badge" :class="p.cantidad < 5 ? 'bg-danger' : 'bg-success'"
                        x-text="p.cantidad"></span></td>
              <td><button class="btn btn-sm btn-outline-danger" @click="eliminar(p.id)">Eliminar</button></td>
            </tr>
          </template>
          <tr x-show="!cargando && filtrados.length === 0">
            <td colspan="5" class="text-center text-muted py-3">No hay productos que mostrar</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
