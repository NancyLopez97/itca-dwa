<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicio 2 · Código migrado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="h3 mb-3">Inventario (versión migrada a JavaScript nativo)</h1>
    <div id="mensaje" class="alert alert-danger" style="display:none"></div>
    <div class="input-group mb-3">
      <input id="buscar" type="text" class="form-control" placeholder="Buscar...">
      <button id="btn-limpiar" class="btn btn-outline-secondary" type="button">Limpiar</button>
    </div>
    <table class="table table-striped">
      <thead class="table-dark">
        <tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Cantidad</th></tr>
      </thead>
      <tbody id="tabla-productos"></tbody>
    </table>
  </div>
  <script src="migrado.js"></script>
</body>
</html>
