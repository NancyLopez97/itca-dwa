<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semana 9 | Formularios con Bootstrap 5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <h1 class="h4 mb-3">Ejercicio 2: texto de ayuda y estados</h1>

    <div class="mb-4">
      <label for="clave5" class="form-label">Contraseña</label>
      <input type="password" id="clave5" class="form-control" aria-describedby="ayudaBloque">
      <div id="ayudaBloque" class="form-text">
        De 8 a 20 caracteres, con letras y números, sin espacios ni emojis.
      </div>
    </div>

    <div class="row g-3 align-items-center mb-4">
      <div class="col-auto">
        <label for="clave6" class="col-form-label">Contraseña</label>
      </div>
      <div class="col-auto">
        <input type="password" id="clave6" class="form-control" aria-describedby="ayudaLinea">
      </div>
      <div class="col-auto">
        <span id="ayudaLinea" class="form-text">De 8 a 20 caracteres.</span>
      </div>
    </div>

    <div class="mb-4">
      <label for="codigo" class="form-label">Código de cliente</label>
      <input type="text" id="codigo" class="form-control" value="CLI-0001" readonly>
    </div>

    <form>
      <fieldset disabled>
        <legend class="fs-6">Datos de facturación (disponible próximamente)</legend>
        <div class="mb-3">
          <label for="nit" class="form-label">NIT</label>
          <input type="text" id="nit" class="form-control">
        </div>
      
      </fieldset>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
