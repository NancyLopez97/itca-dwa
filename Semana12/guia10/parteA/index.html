<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario heredado (jQuery)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="h3 mb-3">Inventario de productos (versión heredada)</h1>
    <div id="mensaje" class="alert alert-danger" style="display:none"></div>

    <form id="form-producto" class="row g-2 mb-4">
      <div class="col-md-4"><input name="nombre" class="form-control" placeholder="Nombre"></div>
      <div class="col-md-3">
        <select name="categoria" class="form-select">
          <option>Alimentos</option><option>Bebidas</option>
          <option>Artesanías</option><option>Tecnología</option>
        </select>
      </div>
      <div class="col-md-2"><input name="precio" type="number" step="0.01" value="1" class="form-control"></div>
      <div class="col-md-2"><input name="cantidad" type="number" value="1" class="form-control"></div>
      <div class="col-md-1 d-grid"><button class="btn btn-primary">+</button></div>
    </form>

    <div class="row g-2 mb-2 align-items-center">
      <div class="col-md-6"><input id="buscar" class="form-control" placeholder="Buscar..."></div>
      <div class="col-md-3">
        <div class="form-check">
          <input id="solo-bajo" type="checkbox" class="form-check-input">
          <label for="solo-bajo" class="form-check-label">Solo stock bajo (&lt; 5)</label>
        </div>
      </div>
      <div class="col-md-3 text-md-end text-muted" id="contador"></div>
    </div>

    <table id="tabla" class="table table-striped table-sm align-middle bg-white">
      <thead class="table-dark">
        <tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Cantidad</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="legado.js"></script>
</body>
</html>
